[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbgen"
version = "0.1.0"
description = "Semantic snapshot generator for cold-start codebase exploration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "kbgen"}]
dependencies = []

[project.scripts]
kbgen = "kbgen.cli:main"

[tool.setuptools.packages.find]
include = ["kbgen*"]
